<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halka</title>
<style>
:root{--bg:#F6F5F2;--sf:#fff;--ink:#1C1C21;--mu:#8A8A93;--ln:#E7E5E0;--ac:#4F5BD5;--as:#ECEEFB;--dg:#C0504D;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121214;--sf:#1A1A1E;--ink:#ECECF0;--mu:#8B8B95;--ln:#2A2A30;--ac:#7C86F0;--as:#23253A;--dg:#E07A77;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Inter,Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:.2px}
.ring{width:22px;height:22px;border-radius:50%;border:3px solid var(--ac)}
.hide{display:none!important}
/* login */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:32px;width:100%;max-width:380px}
.card .logo{justify-content:center;margin-bottom:6px;font-size:26px}
.sub{text-align:center;color:var(--mu);margin-bottom:24px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:18px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--mu)}
.tabs button.on{background:var(--sf);color:var(--ink);font-weight:500}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:11px 13px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.f{margin-bottom:14px}
.btn{width:100%;border:0;background:var(--ac);color:#fff;padding:12px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.6}
.err{color:var(--dg);font-size:13px;min-height:18px;margin-bottom:8px}
/* app */
#app{height:100%;display:flex;flex-direction:column}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--sf);border-bottom:1px solid var(--ln);flex:none}
.hr{display:flex;align-items:center;gap:8px}
.chip{font-size:13px;color:var(--mu);padding:0 6px}
.ghost{border:1px solid var(--ln);background:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.ghost:hover{background:var(--bg)}
.ghost.ac{border-color:var(--ac);color:var(--ac)}
main{flex:1;display:flex;min-height:0}
aside{width:300px;background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;flex:none}
.ah{padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.list{overflow:auto;flex:1;padding:0 8px 8px}
.room{padding:12px;border-radius:10px;cursor:pointer}
.room:hover{background:var(--bg)}
.room.on{background:var(--as)}
.room b{display:block;font-weight:500}
.room small{color:var(--mu)}
section{flex:1;display:flex;flex-direction:column;min-width:0}
.ch{padding:14px 20px;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px}
.ch div{flex:1;min-width:0}
.ch small{color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}
#msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(70%,520px);align-self:flex-start}
.m .n{font-size:12px;color:var(--mu);margin:0 4px 2px}
.m .b{background:var(--sf);border:1px solid var(--ln);padding:9px 13px;border-radius:14px;border-top-left-radius:4px;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;text-align:right}
.m.me .b{background:var(--ac);border-color:var(--ac);color:#fff;border-radius:14px;border-top-right-radius:4px;text-align:left}
.m .x{border:0;background:none;color:var(--dg);font-size:12px;cursor:pointer;margin-left:6px}
.empty{margin:auto;color:var(--mu);text-align:center}
.send{display:flex;gap:10px;padding:14px 20px;background:var(--sf);border-top:1px solid var(--ln)}
.send input{flex:1}
.send .btn{width:auto;padding:0 22px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov .card{max-width:440px;max-height:85vh;overflow:auto}
.ov h3{margin-bottom:16px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.row small{color:var(--mu)}
.dl{border:0;background:none;color:var(--dg);cursor:pointer}
@media(max-width:720px){
 aside{width:100%;border:0}
 section{display:none}
 #app.inroom aside{display:none}
 #app.inroom section{display:flex}
 .back{display:block}
 .m{max-width:85%}
}

.hl{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;border:0;background:var(--as);color:var(--ac);font-weight:600;cursor:pointer;overflow:hidden;display:grid;place-items:center;padding:0}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:88px;height:88px;font-size:32px;margin:0 auto 10px;cursor:default}
.gold{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:5px 12px 5px 8px;font-size:14px}
.gold svg{width:18px;height:18px}
.quick{display:flex;gap:10px;padding:14px 16px 4px}
.q{flex:1;border:1px solid var(--ln);background:var(--bg);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:13px;transition:transform .15s}
.q:active{transform:scale(.96)}
.q i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.q svg{width:22px;height:22px}
.pg{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-top:8px}
.pg i{display:block;height:100%;background:var(--ac);transition:width .4s}
.tk{padding:12px 0;border-bottom:1px solid var(--ln)}
.rw{font-size:12px;color:var(--mu)}
.btn.sm{width:auto;padding:6px 14px;font-size:13px}
.stat{display:flex;justify-content:center;gap:18px;color:var(--mu);font-size:13px;margin-bottom:14px}
.ov{animation:fd .18s ease}.ov .card{animation:up .22s ease}
@keyframes fd{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media(max-width:720px){header .logo,.chip{display:none}}
.rk{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--ln)}
.rk.me{background:var(--as);border-radius:10px;border-color:transparent}
.rk .pos{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--bg);color:var(--mu);flex:none}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .pp{font-size:13px;color:var(--mu);white-space:nowrap}
.fr{display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu);opacity:.5;flex:none}
.dot.on{background:#34A86E;opacity:1;box-shadow:0 0 0 3px rgba(52,168,110,.2)}
.addf{display:flex;gap:8px;margin-bottom:6px}
.addf .btn{white-space:nowrap}

aside{overflow-y:auto}
.list{overflow:visible;flex:none;min-height:60px}
.gh{padding:14px 16px 2px;font-weight:700;font-size:18px}
.gc{position:relative;display:block;width:calc(100% - 32px);margin:8px 16px 4px;height:84px;border:3px solid #FFD48A;border-radius:20px;background:linear-gradient(135deg,#F7A63B,#E4791C);color:#fff;text-align:left;padding:0 0 0 24px;cursor:pointer;overflow:hidden;box-shadow:0 4px 0 #B85F12;transition:transform .15s}
.gc:active{transform:translateY(2px);box-shadow:0 2px 0 #B85F12}
.gc::before,.gc::after{content:"";position:absolute;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--sf);border:3px solid #FFD48A}
.gc::before{left:-15px}.gc::after{right:-15px}
.gc .ol{position:absolute;inset:6px;border:1.5px solid rgba(255,230,170,.55);border-radius:14px;pointer-events:none}
.gc .t{position:relative;display:block;font-size:20px;font-weight:700;text-shadow:0 2px 0 rgba(120,50,0,.45)}
.gc .s{position:relative;display:block;font-size:12px;opacity:.9;margin-top:2px}
.gc svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:104px;height:70px}
.gp{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.gph{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--sf);border-bottom:1px solid var(--ln);flex:none}
.gph b{flex:1;font-weight:600}
.gpb{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;max-width:560px;width:100%;margin:0 auto}
.dm-hero{background:linear-gradient(135deg,#F7A63B,#E4791C);border-radius:20px;height:120px;display:grid;place-items:center}
.dm-hero svg{height:96px}
.gl{font-weight:600;margin-top:6px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb{border:1px solid var(--ln);background:var(--sf);border-radius:16px;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;transition:transform .15s}
.mb b{font-size:17px;font-weight:600}
.mb small{color:var(--mu);font-size:14px}
.mb.paid{border-color:#E8A93A;background:rgba(232,169,58,.1)}
.mb:active{transform:scale(.97)}
.mb:disabled,.btn:disabled{opacity:.6}
.ops{display:flex;gap:8px}
.op{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center;font-size:14px}
.op small{display:block;color:var(--mu)}
.op.on{border-color:var(--ac);background:var(--as)}
.ends{text-align:center;font-size:13px;color:var(--mu)}
.board{flex:1;min-height:150px;background:#2F6B4F;border-radius:16px;padding:12px;overflow:auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center}
.stt{text-align:center;font-size:14px;min-height:21px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0 10px}
.sd{display:flex;gap:8px}
.sd .btn{width:auto;flex:1;padding:10px 6px;font-size:14px}
.dt{--s:30px;display:inline-flex;background:#FAF8F2;border:1.5px solid #2b2b30;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.35);flex:none;align-items:stretch}
.dt.v{flex-direction:column}
.dt.big{--s:38px}
.dt .h{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--s)*.14)}
.dt .h b{display:block;border-radius:50%;margin:14%}
.dt .h b.o{background:#222}
.dt i{background:#2b2b30;width:1.5px;margin:12% 0}
.dt.v i{width:auto;height:1.5px;margin:0 12%}
.dt.ok{cursor:pointer;outline:3px solid var(--ac);transform:translateY(-4px)}
.dt.no{opacity:.45}
.dt.sel{outline-color:#E8A93A}

/* domino: düzeltme + animasyonlar */
.board{align-items:center;align-content:flex-start;gap:6px;background:radial-gradient(ellipse at 50% 40%,#3f8a64,#2a6048 75%);border:6px solid #6b4a2b;box-shadow:inset 0 0 36px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.25)}
.hand{align-items:flex-end;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px 8px 12px}
.op{display:flex;align-items:center;gap:8px;text-align:left;justify-content:center}
.oa{width:34px;height:34px;border-radius:50%;background:var(--as);color:var(--ac);display:grid;place-items:center;font-weight:600;flex:none}
.op.on{animation:glow 1.2s ease-in-out infinite}
.dt.ok:hover{transform:translateY(-8px)}
.dt.sel{transform:translateY(-14px) scale(1.07);outline-color:#E8A93A}
.dt.dropme{animation:dropMe .5s cubic-bezier(.2,.8,.3,1),ring .6s .3s ease-out}
.dt.dropbot{animation:dropBot .5s cubic-bezier(.2,.8,.3,1),ring .6s .3s ease-out}
.dt.deal{animation:dealIn .42s cubic-bezier(.2,.8,.3,1) backwards}
.dt.fresh{animation:pop .35s ease-out}
.shuf{flex:1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;align-self:stretch;min-height:130px}
.bk{display:block;position:relative;width:34px;height:64px;border-radius:6px;background:linear-gradient(145deg,#3a49a8,#1b2468);border:2px solid #0e1440;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.bk::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;background:rgba(255,255,255,.35);transform:rotate(45deg)}
.bk:nth-child(odd){animation:shufA .62s ease-in-out infinite}
.bk:nth-child(even){animation:shufB .54s ease-in-out infinite}
.bk:nth-child(3n){animation-delay:-.2s}
.bk:nth-child(4n){animation-delay:-.35s}
@keyframes dropMe{0%{opacity:0;transform:translateY(90px) scale(1.5) rotate(10deg);box-shadow:0 30px 30px rgba(0,0,0,.4)}65%{opacity:1;transform:translateY(-3px) scale(.96) rotate(0)}100%{transform:none}}
@keyframes dropBot{0%{opacity:0;transform:translateY(-90px) scale(1.5) rotate(-10deg);box-shadow:0 30px 30px rgba(0,0,0,.4)}65%{opacity:1;transform:translateY(3px) scale(.96) rotate(0)}100%{transform:none}}
@keyframes dealIn{from{opacity:0;transform:translate(0,-150px) rotate(-30deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}100%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(79,91,213,0)}50%{box-shadow:0 0 0 5px rgba(79,91,213,.28)}}
@keyframes shufA{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(34px,-26px) rotate(25deg)}50%{transform:translate(-36px,18px) rotate(-30deg)}75%{transform:translate(16px,30px) rotate(12deg)}}
@keyframes shufB{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-30px,24px) rotate(-22deg)}50%{transform:translate(32px,-20px) rotate(28deg)}75%{transform:translate(-14px,-30px) rotate(-10deg)}}

.ov{z-index:30}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#1C1C21;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0)}
#pf{overflow:auto;display:block;z-index:20}
.pw{max-width:560px;margin:0 auto;background:var(--sf);min-height:100%;position:relative;padding-bottom:96px}
.cv{height:210px;background:linear-gradient(135deg,#8E9BFF,#F28CB1) center/cover;position:relative;cursor:pointer}
.cv .tb{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;font-size:16px}
.pc{margin-top:-24px;background:var(--sf);border-radius:24px 24px 0 0;position:relative;padding:0 16px}
.pav{width:76px;height:76px;border-radius:22px;border:4px solid var(--sf);margin-top:-38px;background:var(--as);color:var(--ac);display:grid;place-items:center;font-size:30px;font-weight:600;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover}
.pn{font-size:20px;font-weight:700;margin-top:6px}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:12px;align-items:center}
.tg span{background:var(--bg);border-radius:10px;padding:2px 8px}
.tg .lv{background:#FFE9C2;color:#9A5B00}
.sc{padding:14px 0;border-top:1px solid var(--ln)}
.sh{display:flex;justify-content:space-between;align-items:center;font-weight:600;cursor:pointer}
.sh small{color:var(--mu);font-weight:400}
.gi{display:flex;gap:8px;margin-top:8px;overflow:auto}
.gi span{width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:24px;flex:none}
.fc{border-radius:16px;padding:10px 12px;color:#fff;margin-top:8px;border:2px solid #FFD48A}
.fh{display:flex;align-items:center;gap:8px}.fh b{flex:1}
.pl{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.3);color:#fff;font-size:18px;cursor:pointer}
.fm{display:flex;gap:6px;margin-top:6px;min-height:6px}
.pa{width:34px;height:34px;border-radius:50%;background:var(--as);color:var(--ac);display:inline-grid;place-items:center;font-weight:600;border:0;cursor:pointer;flex:none}
.rowav{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.bb{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px;background:var(--sf);border-top:1px solid var(--ln);max-width:560px;margin:0 auto}
.bb button{flex:1;border:0;border-radius:24px;padding:13px;color:#fff;font-weight:600;cursor:pointer}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gg button{border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:10px 4px;cursor:pointer}
.gg button.on{border-color:#F25C9A;background:rgba(242,92,154,.1)}

#bn{display:flex;flex:none;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln)}
#bn button{flex:1;border:0;border-radius:14px;padding:7px 2px;background:rgba(176,132,92,.16);color:#8A6240;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer;transition:transform .15s}
#bn button:active{transform:scale(.95)}
#bn button.on{background:rgba(176,132,92,.4);color:#5E3F22;font-weight:600}
#bn svg{width:24px;height:24px}
@media(prefers-color-scheme:dark){#bn button{color:#D2A97F}#bn button.on{color:#F0CFA6}}
#app[data-tab=h] section,#app[data-tab=m] section,#app[data-tab=k] section{display:none}
#app[data-tab=h] aside,#app[data-tab=m] aside,#app[data-tab=k] aside{width:100%;max-width:560px;margin:0 auto;border:0}
.rh{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px;font-weight:700;font-size:18px}
.cats{display:flex;gap:6px;overflow:auto;padding:0 12px 10px;flex:none}
.cat{flex:none;border:0;background:none;padding:6px 12px;border-radius:12px;color:var(--mu);cursor:pointer;font-weight:500}
.cat.on{background:rgba(176,132,92,.2);color:#8A6240;font-weight:700}
.room{display:flex;gap:12px;align-items:center}
.room>div:last-child{min-width:0}
.ra{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none}
.tgc{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;margin-right:6px}
.tp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.tp button{border:1px solid var(--ln);background:none;border-radius:14px;padding:6px 14px;cursor:pointer}
.tp button.on{color:#fff;border-color:transparent}
@media(max-width:720px){#app.inroom #bn{display:none}}

.uc{isolation:isolate;--w:58px;--cc:#E02B25;--cl:#FF6A5E;--cd:#8C0F0C;width:var(--w);height:calc(var(--w)*1.5);border-radius:calc(var(--w)*.14);border:calc(var(--w)*.05) solid #fff;position:relative;flex:none;color:#fff;overflow:hidden;background:radial-gradient(circle at 28% 18%,var(--cl),var(--cc) 52%,var(--cd));box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 12px var(--cc),0 4px 8px rgba(0,0,0,.5);user-select:none;transition:transform .18s,box-shadow .18s;font-family:"Arial Black",Impact,system-ui,sans-serif}
.uc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.38),rgba(255,255,255,0) 38%);pointer-events:none;z-index:3}
.uc.cr{--cc:#E02B25;--cl:#FF6A5E;--cd:#8C0F0C}.uc.cy{--cc:#F5BE1B;--cl:#FFE36B;--cd:#B07A00}.uc.cg{--cc:#1FAA3C;--cl:#6EE58A;--cd:#0A5A1B}.uc.cb{--cc:#1E6BE0;--cl:#6DAAFF;--cd:#0A3A8C}
.uc.cw,.uc.cx{--cc:#17171d;--cl:#3b3b46;--cd:#000}

/* ses motoru (WebAudio, dosya gerekmez) */
const SND={
 c:null,nb:null,on:true,
 init(){
  try{
   if(!this.c){
    const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
    this.c=new A();const n=this.c.sampleRate;this.nb=this.c.createBuffer(1,n,n);
    const d=this.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
   }
   if(this.c.state=='suspended')this.c.resume();
  }catch(e){}
 },
 ok(){return this.on&&this.c&&this.c.state!='closed'},
 blip(f1,f2,d,vol,type,at){
  if(!this.ok())return;
  const c=this.c,t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03);
 },
 puff(type,fq,q,d,vol,at){
  if(!this.ok())return;
  const c=this.c,t=c.currentTime+(at||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=this.nb;f.type=type;f.frequency.value=fq;f.Q.value=q;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.004);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t,Math.random()*0.4);s.stop(t+d+0.03);
 },

 win(){[523,659,784,1047].forEach((f,i)=>this.blip(f,f,0.18,0.14,'triangle',i*0.12))},

const DM={
 deal(n){
  const all=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)all.push([i,j]);
  for(let i=all.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));const x=all[i];all[i]=all[k];all[k]=x}
  const hands=[];for(let p=0;p<n;p++)hands.push(all.splice(0,7));
  return{hands:hands,yard:all};
 },
 start(hands){
  let best=-1,bp=0,bi=0;
  hands.forEach((h,p)=>h.forEach((t,i)=>{const sc=t[0]==t[1]?100+t[0]:t[0]+t[1];if(sc>best){best=sc;bp=p;bi=i}}));
  return{p:bp,i:bi};
 },
 fits(t,chain){
  if(!chain.length)return{l:true,r:true};
  const L=chain[0][0],R=chain[chain.length-1][1];
  return{l:t[0]==L||t[1]==L,r:t[0]==R||t[1]==R};
 },
 place(chain,t,side){
  if(!chain.length)return[[t[0],t[1]]];
  const L=chain[0][0],R=chain[chain.length-1][1];
  if(side=='r')return chain.concat([t[0]==R?[t[0],t[1]]:[t[1],t[0]]]);
  return[t[1]==L?[t[0],t[1]]:[t[1],t[0]]].concat(chain);
 }
};

function dmBegin(n,paid,fee,gid){
 if($('gp').classList.contains('hide'))return;

 SND.init();SND.shuffle();dmRender();
 setTimeout(()=>{
  if(G!==g||g.over)return;
  g.phase='deal';SND.deal(7);dmRender();
  setTimeout(()=>{
   if(G!==g||g.over)return;
   g.phase='';
   const s=g.first,t=g.hands[s.p].splice(s.i,1)[0];

   g.msg=s.p==0?'En büyük taşla sen başladın.':names[s.p]+' en büyük taşla başladı.';
   SND.place();dmRender();dmNext();
  },1150);
 },1700);
}

function dmCan(g,p){return g.hands[p].some(t=>{const f=DM.fits(t,g.chain);return f.l||f.r})}

function dmRender(){
 const g=G;if(!g)return;
 const ph=g.phase,my=g.turn==0&&!g.over&&!ph,can=my&&dmCan(g,0);
 const has=g.chain.length>0;
 const L=has?g.chain[0][0]:'–',R=has?g.chain[g.chain.length-1][1]:'–';
 const opp=g.names.slice(1).map((nm,k)=>{const p=k+1;return `<div class="op ${g.turn==p&&!g.over&&!ph?'on':''}"><span class="oa">${nm.replace('Bot ','')[0]}</span><div><b>${nm}</b><small>${g.hands[p].length} taş</small></div></div>`}).join('');
 let board='';
 if(ph=='shuffle'){board='<div class="shuf">'+'<i class="bk"></i>'.repeat(10)+'</div>'}
 else{
  const fr=g.fresh;
  board=g.chain.map((t,i)=>dmTile(t,(t[0]==t[1]?'v ':'')+(fr&&fr.idx===i?(fr.by=='me'?'dropme':'dropbot'):''))).join('');
 }
 g.fresh=null;
 const fh=g.freshHand;g.freshHand=-1;
 let hand='';
 if(ph!='shuffle')hand=g.hands[0].map((t,i)=>{
  const f=DM.fits(t,g.chain),ok=my&&(f.l||f.r);
  const cls='v big '+(my?(ok?'ok':'no'):'')+(g.sel===i?' sel':'')+(ph=='deal'?' deal':'')+(fh===i?' fresh':'');
  const ex=`data-i="${i}"`+(ph=='deal'?` style="animation-delay:${i*90}ms"`:'');
  return dmTile(t,cls,ex)}).join('');
 let status=g.msg;
 if(ph=='shuffle')status='Taşlar karıştırılıyor…';
 else if(ph=='deal')status='Taşlar dağıtılıyor…';
 else if(my&&can)status+=' Sıra sende.';
 else if(my&&g.yard.length)status+=' Oynayacak taşın yok, taş çek.';
 let ctl='';
 if(my&&!can&&g.yard.length)ctl=`<button class="btn" id="gd">Taş çek (${g.yard.length})</button>`;
 if(my&&g.sel!==null)ctl=`<div class="sd"><button class="btn" id="gl">← Sol uç (${L})</button><button class="btn" id="gr">Sağ uç (${R}) →</button><button class="ghost" id="gx">Vazgeç</button></div>`;
 let res='';
 if(g.res){
  const title=g.res=='won'?'Kazandın!':g.res=='draw'?'Berabere':'Kaybettin';
  let det='';
  if(g.paid){
   if(g.err)det=g.err;
   else if(g.res=='won')det=g.prize!=null?'+'+g.prize+' altın kazandın.':'Ödül işleniyor…';
   else if(g.res=='draw')det=g.prize!=null?'Giriş ücretin ('+g.prize+' altın) iade edildi.':'İade işleniyor…';
   else det='Giriş ücretin ('+g.fee+' altın) yandı.';
  }
  res=`<div class="ov" style="position:absolute"><div class="card res" style="text-align:center"><h3>${title}</h3><p class="sub" style="margin-bottom:16px">${g.msg}${det?'<br>'+det:''}</p><button class="btn" id="ga" style="margin-bottom:10px">Tekrar oyna</button><button class="ghost" id="gm" style="width:100%">Menü</button></div></div>`;
 }
 $('gp').innerHTML=`<div class="gph"><button class="ghost" id="gb">←</button><b>Domino · ${g.n} kişilik${g.paid?' · ücretli':''}</b>${sndBtn()}<span class="gold">${COIN}<b id="gg">${st?st.gold:0}</b></span></div>
 <div class="gpb"><div class="ops">${opp}</div>
 <div class="ends">${has?`Sol uç <b>${L}</b> · Sağ uç <b>${R}</b>`:'&nbsp;'}${g.n==2?' · Kalan taş <b>'+g.yard.length+'</b>':''}</div>
 <div class="board">${board}</div>
 <div class="stt">${status}</div>${ctl}
 <div class="hand">${hand}</div></div>${res}`;

 $('gp').querySelectorAll('.big.ok').forEach(el=>el.onclick=()=>{SND.tick();dmPick(+el.dataset.i)});

 if($('gl'))$('gl').onclick=()=>dmPlay(g.sel,'l');

function dmLeave(){
 const g=G;
 if(g&&!g.over){
  if(!confirm(g.paid?'Oyundan çıkarsan giriş ücretin yanar. Çıkılsın mı?':'Oyundan çıkılsın mı?'))return;
  g.over=true;
  if(g.paid&&g.gid)rpc('halka_game_finish',{...cred(),p_id:g.gid,p_result:'lost'}).then(refreshStats).catch(()=>{});
 }
 dmModes();
}

function dmPick(i){
 const g=G;if(!g||g.over||g.turn!=0)return;
 const t=g.hands[0][i];if(!t)return;
 const f=DM.fits(t,g.chain);if(!f.l&&!f.r)return;
 const L=g.chain[0][0],R=g.chain[g.chain.length-1][1];
 if(f.l&&f.r&&L!=R){g.sel=i;dmRender();return}
 dmPlay(i,f.r?'r':'l');
}

function dmPlay(i,side){
 const g=G;if(!g||g.over||g.turn!=0||i===null)return;
 const t=g.hands[0][i];if(!t)return;
 const f=DM.fits(t,g.chain);if(side=='l'?!f.l:!f.r)return;
 g.hands[0].splice(i,1);
 g.chain=DM.place(g.chain,t,side);
 g.fresh={idx:side=='l'?0:g.chain.length-1,by:'me'};
 SND.place();
 g.sel=null;g.passes=0;g.msg='Taş oynadın.';
 if(!g.hands[0].length){dmEnd(0);return}
 dmAdvance();
}

function dmAdvance(){
 const g=G;if(!g||g.over)return;
 g.turn=(g.turn+1)%g.n;
 dmRender();dmNext();
}

function dmNext(){
 const g=G;if(!g||g.over)return;
 if(g.turn==0){
  if(dmCan(g,0)||g.yard.length)return;
  g.msg='Oynayacak taşın yok, pas geçtin.';dmRender();
  setTimeout(()=>dmPass(g,'Oynayacak taşın yok, pas geçtin.'),1100);
  return;
 }
 setTimeout(()=>dmBot(g),900);
}

function dmPass(g,msg){
 if(G!==g||g.over)return;
 g.msg=msg||g.names[g.turn]+' pas geçti.';
 SND.pass();
 g.passes++;
 if(g.passes>=g.n){dmEnd(null);return}
 dmAdvance();
}

function dmBot(g){
 if(G!==g||g.over)return;
 const p=g.turn,h=g.hands[p];let best=null;
 h.forEach((t,i)=>{const f=DM.fits(t,g.chain);if(!f.l&&!f.r)return;const sc=t[0]+t[1]+(t[0]==t[1]?3:0);if(!best||sc>best.sc)best={i:i,f:f,sc:sc}});
 if(!best){
  if(g.yard.length){h.push(g.yard.pop());g.msg=g.names[p]+' taş çekti.';SND.flick();dmRender();setTimeout(()=>dmBot(g),700);return}
  dmPass(g);return;
 }
 const t=h.splice(best.i,1)[0];
 const side=best.f.l&&best.f.r?(Math.random()<.5?'l':'r'):(best.f.r?'r':'l');
 g.chain=DM.place(g.chain,t,side);
 g.fresh={idx:side=='l'?0:g.chain.length-1,by:'bot'};
 SND.place();
 g.passes=0;g.msg=g.names[p]+' taş oynadı.';
 if(!h.length){dmEnd(p);return}
 dmAdvance();
}

async function dmEnd(w){
 const g=G;if(!g)return;
 g.over=true;g.sel=null;let res;
 if(w===null){
  const sums=g.hands.map(h=>h.reduce((a,t)=>a+t[0]+t[1],0)),m=Math.min.apply(null,sums);
  const ws=[];sums.forEach((s,i)=>{if(s==m)ws.push(i)});
  res=ws.indexOf(0)>=0?(ws.length==1?'won':'draw'):'lost';
  g.msg='Oyun kilitlendi. En düşük taş toplamı: '+m+'.';
 }else{
  res=w==0?'won':'lost';
  g.msg=w==0?'Tüm taşlarını bitirdin!':g.names[w]+' tüm taşlarını bitirdi.';
 }
 g.res=res;SND[res=='won'?'win':res=='draw'?'tie':'lose']();dmRender();
 if(g.paid&&g.gid){
  try{const r=await rpc('halka_game_finish',{...cred(),p_id:g.gid,p_result:res});g.prize=r?r.prize:0;refreshStats()}
  catch(e){g.err='Sonuç kaydedilemedi: '+setupMsg(e)}
  if(G===g)dmRender();
 }
}

/* ===== Mesajlar + Keşfet ===== */
const escA=s=>esc(s).replace(/"/g,'&quot;');
const isMe=a=>!!me&&String(a||'').toLowerCase()==me.u.toLowerCase();
const CN=()=>me.cn||me.u;
const ltr=s=>esc(String(s||'?')[0].toUpperCase());
function agoS(t){const s=Math.max(0,(Date.now()-new Date(t).getTime())/1000);if(s<60)return 'az önce';if(s<3600)return Math.floor(s/60)+' dk';if(s<86400)return Math.floor(s/3600)+' sa';if(s<604800)return Math.floor(s/86400)+' g';return new Date(t).toLocaleDateString('tr-TR')}
const kMsg=e=>/Could not find|schema cache|does not exist/i.test(e.message)?'Keşfet için Supabase kurulumu (halka_kesfet.sql) gerekli.':e.message;
const catName=c=>(CATS.find(x=>x[0]==c)||['','Arkadaş'])[1];

/* arkadaşlık istekleri + bildirim */
let RQ=[],RF=[],HF=[],MYF=new Set(),SENT=new Set(),rqSeen=null;
async function pollReq(){
 if(!me)return;
 try{
  const d=await rpc('prof_get',{...cred(),p_target:me.u});
  if(d.u)me.cn=d.u;
  RQ=d.inbox||[];RF=(d.friends||[]).filter(f=>f.kind=='friend');
  MYF=new Set(RF.map(f=>f.u.toLowerCase()));
  if(rqSeen!==null&&RQ.length>rqSeen)tw('Yeni arkadaşlık isteği 👋');
  rqSeen=RQ.length;paintReq();
 }catch(e){}
}
function paintReq(){
 const n=RQ.length,t=n>9?'9+':String(n);
 [$('rqb'),$('nbm')].forEach(b=>{if(!b)return;b.textContent=t;b.classList.toggle('hide',!n)});
}
(function(){const m=document.querySelector('#bn [data-t=m]');if(m)m.insertAdjacentHTML('beforeend','<i class="bdg hide" id="nbm"></i>')})();
function openReqs(){modal('<h3>Arkadaşlık istekleri</h3><div id="rql"></div>');drawReqs();pollReq().then(drawReqs)}
function drawReqs(){
 const b=$('rql');if(!b)return;
 b.innerHTML=RQ.length?RQ.map(i=>`<div class="row"><div><a href="#" data-pf="${escA(i.a)}" style="color:inherit;font-weight:600">@${esc(i.a)}</a><br><small>${i.kind=='guard'?'Koruma isteği':'Arkadaşlık: '+esc(catName(i.cat))}</small></div><div><button class="btn sm" data-r="${i.id}" data-ok="1">Kabul</button> <button class="dl" data-r="${i.id}" data-ok="0">Reddet</button></div></div>`).join(''):'<div class="empty" style="padding:26px 0">Bekleyen istek yok.</div>';
 b.querySelectorAll('[data-r]').forEach(x=>x.onclick=async()=>{x.disabled=true;
  try{await rpc('rel_resp',{...cred(),p_id:+x.dataset.r,p_ok:x.dataset.ok=='1'});tw(x.dataset.ok=='1'?'Arkadaş eklendi 🎉':'İstek reddedildi');await pollReq();drawReqs();if(!$('hubM').classList.contains('hide'))loadMsgList()}
  catch(e){tw(setupMsg(e));x.disabled=false}});
}
$('rq').onclick=openReqs;

/* mesajlar: arkadaş listesi */
async function loadMsgList(){
 const box=$('mlist');if(!box)return;
 if(!box.innerHTML)box.innerHTML='<div class="empty" style="padding:30px 0">Yükleniyor…</div>';
 const [hf]=await Promise.all([rpc('halka_friends',cred()).catch(()=>[]),pollReq()]);
 HF=hf||[];
 const map=new Map();
 HF.forEach(f=>map.set(f.username.toLowerCase(),{u:f.username,online:!!f.online,sub:seenTxt(f)}));
 RF.forEach(f=>{const k=f.u.toLowerCase();if(!map.has(k))map.set(k,{u:f.u,online:false,sub:catName(f.cat)})});
 const list=[...map.values()].sort((a,b)=>(b.online-a.online)||a.u.localeCompare(b.u,'tr'));
 box.innerHTML=list.length?list.map(f=>`<div class="fro" data-chat="${escA(f.u)}"><div class="ra">${ltr(f.u)}</div><div class="nmx"><b>${esc(f.u)}</b><small>${esc(f.sub)}</small></div><i class="dot ${f.online?'on':''}"></i></div>`).join(''):'<div class="empty" style="padding:50px 20px">Henüz arkadaşın yok.<br>Keşfet bölümünden veya profillerden arkadaş ekleyebilirsin.</div>';
}
$('mlist').onclick=e=>{const r=e.target.closest('[data-chat]');if(r)openChat(r.dataset.chat)};

/* birebir sohbet */
let CHU=null,CHS='';
function closeChat(){clearInterval(window._ch);CHU=null;CHS='';const v=$('dmv');v.classList.add('hide');v.innerHTML=''}
function openChat(u){
 closeChat();CHU=u;
 const v=$('dmv');v.classList.remove('hide');
 v.innerHTML=`<div class="gph"><button class="ghost" id="cbk">←</button><button class="pa" data-pf="${escA(u)}">${ltr(u)}</button><b data-pf="${escA(u)}" style="cursor:pointer">@${esc(u)}</b></div><div class="cml" id="cml"><div class="empty">Yükleniyor…</div></div><form class="send" id="cfm"><input id="cin" maxlength="300" placeholder="Mesaj yaz…" autocomplete="off"><button class="btn">Gönder</button></form>`;
 $('cbk').onclick=closeChat;
 let first=true;
 const L=async()=>{
  if(CHU!==u||!$('cml'))return;
  try{
   const d=await rpc('dm_get',{...cred(),p_target:u})||[];
   if(CHU!==u||!$('cml'))return;
   const sig=d.length+'|'+(d.length?d[d.length-1].body:'');if(sig===CHS)return;CHS=sig;
   const box=$('cml'),near=first||box.scrollHeight-box.scrollTop-box.clientHeight<90;
   box.innerHTML=d.length?d.map(m=>`<div class="m ${isMe(m.a)?'me':''}"><div class="b">${esc(m.body)}</div>${m.created_at?`<div class="tm">${agoS(m.created_at)}</div>`:''}</div>`).join(''):'<div class="empty">Henüz mesaj yok. İlk mesajı sen yaz 👋</div>';
   if(near)box.scrollTop=box.scrollHeight;first=false;
  }catch(e){const box=$('cml');if(box&&first)box.innerHTML='<div class="empty">'+esc(setupMsg(e))+'</div>'}
 };
 $('cfm').onsubmit=async ev=>{
  ev.preventDefault();const i=$('cin'),b=i.value.trim();if(!b)return;
  i.value='';
  try{await rpc('dm_send',{...cred(),p_target:u,p_body:b});CHS='';await L()}catch(e){tw(setupMsg(e));i.value=b}
  i.focus();
 };
 L();clearInterval(window._ch);window._ch=setInterval(L,3000);
}

/* keşfet: anı akışı */
let KF={items:[],more:true,loading:false},KI=null;
const shrinkK=f=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const m=720,r=Math.min(1,m/Math.max(i.width,i.height)),w=Math.round(i.width*r),h=Math.round(i.height*r),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7))};i.onerror=()=>no(new Error('Görsel okunamadı'));i.src=u});
const isFr=u=>{const k=String(u).toLowerCase();return MYF.has(k)||HF.some(f=>f.username.toLowerCase()==k)};
function addBtn(a){return isMe(a)?'':isFr(a)?'<span class="rw">Arkadaş ✓</span>':SENT.has(a.toLowerCase())?'<span class="rw">İstek gönderildi</span>':`<button class="btn sm" data-k="add" data-u="${escA(a)}">+ Arkadaş</button>`}
function postHTML(p){
 return `<article class="kp" data-id="${p.id}"><div class="kh"><button class="pa" data-pf="${escA(p.author)}">${ltr(p.author)}</button><div class="kn"><b data-pf="${escA(p.author)}">@${esc(p.author)}</b><small>${agoS(p.created_at)}</small></div><span class="kx">${addBtn(p.author)}</span>${isMe(p.author)?'<button class="dl" data-k="del">Sil</button>':''}</div>${p.img?`<img class="ki" loading="lazy" src="${escA(p.img)}">`:''}${p.body?`<p class="kb">${esc(p.body)}</p>`:''}<div class="ka"><button data-k="like" class="${p.liked?'on':''}"><i>${p.liked?'♥':'♡'}</i><span>${p.likes}</span></button><button data-k="cmt"><i>💬</i><span>${p.comments}</span></button></div></article>`;
}
function drawFeed(){
 const box=$('kfeed');if(!box)return;
 box.innerHTML=KF.items.length?KF.items.map(postHTML).join('')+(KF.more?'<button class="ghost" data-k="more" style="align-self:center;padding:8px 22px">Daha fazla</button>':''):'<div class="empty" style="padding:50px 20px">📷<br>Henüz paylaşılan anı yok.<br>İlk anıyı sen paylaş!</div>';
}
async function loadFeed(reset){
 if(KF.loading)return;KF.loading=true;
 const box=$('kfeed');
 if(reset){KF.items=[];KF.more=true;box.innerHTML='<div class="empty" style="padding:40px 0">Yükleniyor…</div>'}
 try{
  const before=KF.items.length?KF.items[KF.items.length-1].id:null;
  const [d]=await Promise.all([rpc('hk_feed',{...cred(),p_before:before,p_limit:12}),reset?pollReq():0,reset?rpc('halka_friends',cred()).then(x=>{HF=x||[]}).catch(()=>{}):0]);
  const rows=d||[];KF.items=KF.items.concat(rows);KF.more=rows.length>=12;drawFeed();
 }catch(e){box.innerHTML='<div class="empty" style="padding:40px 20px">'+esc(kMsg(e))+'</div>'}
 KF.loading=false;
}
$('kr').onclick=()=>loadFeed(true);

 const sync=n=>{if(it){it.comments=n;const a=document.querySelector('#kfeed .kp[data-id="'+id+'"] [data-k=cmt] span');if(a)a.textContent=n}};

 g.turn=(((p+g.dir*(1+skip))%g.n)+g.n)%g.n;
 uRender();uNext();
}
function uNext(){
 const g=U;if(!g||g.over)return;
 if(g.turn==0){
  if(!uAny(0)&&!g.deck.length&&g.disc.length<2){g.msg='Çekilecek kart kalmadı, pas.';uRender();setTimeout(()=>uPass(g,'Pas geçtin.'),1100)}
  return;
 }
 setTimeout(()=>uBot(g,false),1300);
}
function uBot(g,drew){
 if(U!==g||g.over)return;
 const p=g.turn,h=g.hands[p],pl=[];
 h.forEach((c,i)=>{if(uCan(c))pl.push(i)});
 if(!pl.length){
  if(drew||!uTake(p,1)){g.msg=g.names[p]+' pas geçti.';SND.pass();g.turn=(p+g.dir+g.n)%g.n;uRender();uNext();return}
  g.msg=g.names[p]+' kart çekti.';SND.flick();uRender();setTimeout(()=>uBot(g,true),900);return;
 }
 const low=g.hands[(p+g.dir+g.n)%g.n].length<=2;let best=pl[0],bs=-99;
 pl.forEach(i=>{const c=h[i];let sc=c.c=='w'?-5:UPT(c);if(low&&['s','d','f'].includes(c.v))sc+=40;if(sc>bs){bs=sc;best=i}});
 const cnt={r:0,y:0,g:0,b:0};h.forEach((c,i)=>{if(i!=best&&c.c!='w')cnt[c.c]++});
 const col=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
 uPlay(p,best,col);
}
async function uEnd(w){
 const g=U;if(!g||g.over)return;
 g.over=true;g.pick=null;clearInterval(g.iv);let res;
 if(w===null||w===undefined){
  const sums=g.hands.map(h=>h.reduce((a,c)=>a+UPT(c),0)),m=Math.min.apply(null,sums),ws=[];
  sums.forEach((s,i)=>{if(s==m)ws.push(i)});
  res=ws.indexOf(0)>=0?(ws.length==1?'won':'draw'):'lost';
  g.msg='Süre doldu! Kalan puanlar: '+g.names.map((n,i)=>n+' '+sums[i]).join(', ')+'.';
 }else{res=w==0?'won':'lost';g.msg=w==0?'Tüm kartlarını bitirdin!':g.names[w]+' tüm kartlarını bitirdi.'}
 g.res=res;SND[res=='won'?'win':res=='draw'?'tie':'lose']();uRender();
 if(g.paid&&g.gid){
  try{const r=await rpc('halka_game_finish',{...cred(),p_id:g.gid,p_result:res});g.prize=r?r.prize:0;refreshStats()}
  catch(e){g.err='Sonuç kaydedilemedi: '+setupMsg(e)}
  if(U===g)uRender();
 }
}
window.addEventListener('resize',()=>{if(U)uFit()});
document.querySelectorAll('.gc').forEach(b=>b.onclick=()=>{if(b.dataset.g=='domino')openDomino();else if(b.dataset.g=='uno')openUno()});
</script>
